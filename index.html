<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links Directory</title>
  <style>
    /* Clean, System-Based Minimalist Styling */
    :root {
      --bg-color: #121214;
      --card-bg: #1a1a1e;
      --card-hover: #26262b;
      --text-main: #e4e4e7;
      --text-muted: #a1a1aa;
      --border-color: #2d2d34;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 2.5rem auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* The Matrix / Grid Configuration */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Clean Button Link Styling */
    .matrix-btn {
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      text-decoration: none;
      color: var(--text-main);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      text-align: left;
    }

    .matrix-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent);
    }

    .matrix-btn:active {
      transform: scale(0.98);
    }

    .btn-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .btn-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jan-tdy navigation hub</h1>
    <p>A quick-access matrix to almost all my sites</p>
  </header>

  <!-- The matrix items dynamically load here -->
  <main class="grid-container" id="matrixGrid"></main>

  <script>
    // ==========================================
    //  EASY EDIT ZONE: ADD OR REMOVE SITES HERE
    // ==========================================
    const sites = [
      { name: "visual-astro", desc: "Many useful astronomical tools", url: "https://japysoft.bombol.space" },
      { name: "jadiv-timelapse", desc: "A tool for creating timelapses", url: "https://jan-tdy.github.io/jadiv-timelapse" },
      { name: "japyscope-remote", desc: "Docs for an smart telescope controller", url: "https://jan-tdy.github.io/japyscope-remote" },
      { name: "jan-tdy", desc: "My projects, astrophotos and more", url: "https://jan-tdy.github.io/jan-tdy" },
    ];

    // ==========================================
    //  AUTOMATIC RENDERING CODE
    // ==========================================
    const grid = document.getElementById('matrixGrid');
    
    sites.forEach(site => {
      const anchor = document.createElement('a');
      anchor.href = site.url;
      anchor.className = 'matrix-btn';
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';

      anchor.innerHTML = `
        <span class="btn-title">${site.name}</span>
        <span class="btn-desc">${site.desc}</span>
      `;
      
      grid.appendChild(anchor);
    });
  </script>

</body>
</html>
